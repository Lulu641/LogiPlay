<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WIP — Logi Play</title>
  <link rel="icon" href="static/images/logo.png" type="image/png" />
  <style>
    html,body{height:100%;margin:0;}
    body{font-family:'Segoe UI','Helvetica Neue',sans-serif;background:url('static/images/1567665.png') no-repeat center center fixed;background-size:cover;color:white;overflow-y:scroll;}
    body::-webkit-scrollbar{width:8px;}body::-webkit-scrollbar-track{background:rgba(0,0,0,0.6);}body::-webkit-scrollbar-thumb{background:#555;border-radius:4px;}body::-webkit-scrollbar-thumb:hover{background:#888;}
    h1{margin-top:18px;font-size:3em;text-align:center;text-decoration:underline;text-shadow:-2px -2px 0 black,2px -2px 0 black,-2px 2px 0 black,2px 2px 0 black;}
    .wrapper{max-width:1100px;margin:0 auto;padding:0 20px 40px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px;}
    .card{background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.6);}
    .card h3{margin:0 0 8px;font-size:1.2rem;text-shadow:-1px -1px 0 black,1px -1px 0 black,-1px 1px 0 black,1px 1px 0 black;}
    .card p{margin:0 0 12px;color:#ddd;font-size:0.95rem;}
    .btn{display:inline-block;padding:9px 14px;background:rgba(0,0,0,0.65);color:white;text-decoration:none;font-weight:600;border-radius:10px;border:3px solid;border-image:linear-gradient(90deg,white,black) 1;transition:.12s;cursor:pointer;}
    .btn:hover{background:rgba(0,0,0,0.8);transform:translateY(-2px);}
  </style>
</head>
<body>
  <h1>Work In Progress (coding work)</h1>
  <div class="wrapper">
    <div class="grid">
      <div class="card">
        <h3>Site 1</h3>
        <p>Fully cloaked — undetectable tab.</p>
        <a href="javascript:void(0)" onclick="openCloakedSite()" class="btn">Open Site 1</a>
      </div>
    </div>
  </div>

  <!-- ==== CDN UV (no local files needed) ==== -->
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/dist/uv.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/dist/uv.config.js"></script>

  <script>
    // ---- OPTIONAL LOCAL SW (delete if you don't have uv/sw.js) ----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/static/sw.js')
        .catch(() => {});
    }

    function openCloakedSite() {
      const targetUrl = "https://sites.google.com/classroom.center/view/your-site-here"; // <<< CHANGE THIS
      const encoded = Ultraviolet.codec.xor.encode(targetUrl);

      const win = window.open("about:blank", "_blank",
        "width=1200,height=800,toolbar=no,menubar=no,location=no");
      if (!win) { alert("Popup blocked – allow pop-ups."); return; }

      win.document.write(`
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Classroom</title>
  <link rel="icon" href="https://classroom.google.com/favicon.ico">
  <!-- CDN UV inside the popup -->
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/dist/uv.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/dist/uv.config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body,iframe{width:100%;height:100%;border:0;overflow:hidden;}
    body{background:#fff;font-family:Roboto,sans-serif;}
    .loading{
      position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:#555;font-size:1.2em;
    }
    .loading::after{
      content:'';width:40px;height:40px;margin-top:20px;
      border:5px solid #f3f3f3;border-top:5px solid #1a73e8;border-radius:50%;
      animation:s 1s linear infinite;
    }
    @keyframes s{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="loading">Loading Google Classroom…</div>
  <iframe src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/service/${encoded}"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation allow-downloads"
          style="display:none;"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet@2.0.0/static/sw.js')
        .catch(()=>{});
    }
    const iframe = document.querySelector('iframe');
    const loading = document.querySelector('.loading');
    iframe.onload = () => {
      loading.style.display = 'none';
      iframe.style.display = 'block';
    };
  </script>
</body>
</html>
      `);
      win.document.close();
    }
  </script>
</body>
</html>
