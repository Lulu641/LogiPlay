<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WIP — Logi Play</title>
  <link rel="icon" href="static/images/logo.png" type="image/png" />
  <style>
    html,body{height:100%;margin:0;}
    body{
      margin:0;
      font-family:'Segoe UI','Helvetica Neue',sans-serif;
      background: url('static/images/1567665.png') no-repeat center center fixed;
      background-size: cover;
      color:white;
      overflow-y:scroll;
    }
    body::-webkit-scrollbar{ width:8px; }
    body::-webkit-scrollbar-track{ background: rgba(0,0,0,0.6); }
    body::-webkit-scrollbar-thumb{ background:#555; border-radius:4px; }
    body::-webkit-scrollbar-thumb:hover{ background:#888; }
    h1{
      margin-top:18px;
      font-size:3em;
      text-align:center;
      text-decoration:underline;
      text-shadow:
        -2px -2px 0 black,
         2px -2px 0 black,
        -2px 2px 0 black,
         2px 2px 0 black;
    }
    .wrapper{
      max-width:1100px;
      margin:0 auto;
      padding:0 20px 40px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:16px;
      margin-top:20px;
    }
    .card{
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }
    .card h3{
      margin:0 0 8px;
      font-size:1.2rem;
      text-shadow:
        -1px -1px 0 black,
         1px -1px 0 black,
        -1px 1px 0 black,
         1px 1px 0 black;
    }
    .card p{
      margin:0 0 12px;
      color:#ddd;
      font-size:0.95rem;
    }
    .btn{
      display:inline-block;
      padding:9px 14px;
      background:rgba(0,0,0,0.65);
      color:white;
      text-decoration:none;
      font-weight:600;
      border-radius:10px;
      border:3px solid;
      border-image:linear-gradient(90deg,white,black) 1;
      transition:.12s;
      cursor:pointer;
    }
    .btn:hover{ background:rgba(0,0,0,0.8); transform:translateY(-2px); }
    .back{
      margin-top:20px;
      text-align:center;
    }
  </style>
</head>
<body>
  <h1>Work In Progress (coding work)</h1>
  <div class="wrapper">
    <div class="grid">
      <!-- CLOAKED SITE 1 -->
      <div class="card">
        <h3>Site 1</h3>
        <p>This is your external site link. Tap below to open it.</p>
        <a href="javascript:void(0)" 
           onclick="cloakSite('https://sites.google.com/classroom.center/view/', 'Google Classroom', 'https://classroom.google.com/favicon.ico')"
           class="btn">
           Open Site 1
        </a>
      </div>
    </div>
  </div>

  <!-- STEALTH CLOAK FUNCTION -->
  <script>
    function cloakSite(url, title = "Google Classroom", favicon = "https://classroom.google.com/favicon.ico") {
      const win = window.open("about:blank", "_blank", "toolbar=no,location=no,directories=no,status=no,menubar=no,scrollbars=no,resizable=yes,width=1200,height=800");

      if (!win) {
        alert("Popup blocked! Allow popups for this site to use cloaked tabs.");
        return;
      }

      win.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>${title}</title>
          <link rel="icon" href="${favicon}" type="image/x-icon">
          <style>
            * { margin:0; padding:0; }
            html, body { width:100%; height:100%; overflow:hidden; background:#f1f3f4; }
            iframe { border:none; width:100%; height:100%; display:block; }
          </style>
        </head>
        <body>
          <iframe src="${url}" 
                  allowfullscreen 
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
                  loading="lazy">
          </iframe>
        </body>
        </html>
      `);
      win.document.close();

      // Optional: Prevent back button from showing real page
      setTimeout(() => {
        const iframe = win.document.querySelector('iframe');
        if (iframe) iframe.focus();
      }, 300);
    }
  </script>
</body>
</html>
