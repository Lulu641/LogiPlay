<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WIP — Logi Play</title>
  <link rel="icon" href="static/images/logo.png" type="image/png" />
  <style>
    html,body{height:100%;margin:0;}
    body{
      margin:0;
      font-family:'Segoe UI','Helvetica Neue',sans-serif;
      background: url('static/images/1567665.png') no-repeat center center fixed;
      background-size: cover;
      color:white;
      overflow-y:scroll;
    }
    body::-webkit-scrollbar{ width:8px; }
    body::-webkit-scrollbar-track{ background: rgba(0,0,0,0.6); }
    body::-webkit-scrollbar-thumb{ background:#555; border-radius:4px; }
    body::-webkit-scrollbar-thumb:hover{ background:#888; }

    h1{
      margin-top:18px;
      font-size:3em;
      text-align:center;
      text-decoration:underline;
      text-shadow:
        -2px -2px 0 black,
         2px -2px 0 black,
        -2px  2px 0 black,
         2px  2px 0 black;
    }

    .wrapper{
      max-width:1100px;
      margin:0 auto;
      padding:0 20px 40px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:16px;
      margin-top:20px;
    }

    .card{
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }

    .card h3{
      margin:0 0 8px;
      font-size:1.2rem;
      text-shadow:
        -1px -1px 0 black,
         1px -1px 0 black,
        -1px  1px 0 black,
         1px  1px 0 black;
    }

    .card p{
      margin:0 0 12px;
      color:#ddd;
      font-size:0.95rem;
    }

    .btn{
      display:inline-block;
      padding:9px 14px;
      background:rgba(0,0,0,0.65);
      color:white;
      text-decoration:none;
      font-weight:600;
      border-radius:10px;
      border:3px solid;
      border-image:linear-gradient(90deg,white,black) 1;
      transition:.12s;
    }
    .btn:hover{ background:rgba(0,0,0,0.8); transform:translateY(-2px); }

    .back{
      margin-top:20px;
      text-align:center;
    }
  </style>
</head>
<body>

<h1>Games</h1>

</body>
</html>
