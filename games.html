<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Games — Logi Play</title>
<link rel="icon" href="static/images/logo.png" type="image/png" />
<style>
    html,body{height:100%;margin:0;}
    body{
        margin:0;
        font-family:'Segoe UI','Helvetica Neue',sans-serif;
        background: url('static/images/1567665.png') no-repeat center center fixed;
        background-size: cover;
        color:white;
        overflow-y:scroll;
        text-align:center;
    }
    body::-webkit-scrollbar{ width:8px; }
    body::-webkit-scrollbar-track{ background: rgba(0,0,0,0.6); }
    body::-webkit-scrollbar-thumb{ background:#555; border-radius:4px; }
    body::-webkit-scrollbar-thumb:hover{ background:#888; }

    h1{
        margin-top:20px;
        font-size:3em;
        text-decoration:underline;
        text-shadow:
            -2px -2px 0 black,
             2px -2px 0 black,
            -2px  2px 0 black,
             2px  2px 0 black;
    }

    .btn-row{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        justify-content:center;
        margin:15px auto;
        padding:10px;
        max-width:900px;
    }

    .src-btn{
        padding:12px 18px;
        font-size:1rem;
        font-weight:600;
        color:white;
        background:rgba(0,0,0,0.65);
        border:3px solid;
        border-image: linear-gradient(90deg, white, black) 1;
        border-radius:12px;
        cursor:pointer;
        text-decoration:none;
        transition:.15s;
    }
    .src-btn:hover{
        background:rgba(0,0,0,0.78);
        transform:translateY(-3px);
    }

    #frame-box{
        width:92%;
        height:75vh;
        margin:20px auto;
        background:rgba(0,0,0,0.45);
        border:1px solid rgba(255,255,255,0.12);
        border-radius:10px;
        backdrop-filter:blur(4px);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:6px;
    }

    #gameframe{
        width:100%;
        height:100%;
        border:0;
        border-radius:8px;
        background:black;
    }

    #error-msg{
        color:#ff8080;
        font-size:1.05rem;
        display:none;
        padding:12px;
    }
</style>
</head>
<body>

<h1>Games Hub</h1>

<div class="btn-row">
    <button class="src-btn" onclick="loadSrc('https://web.cloudmoonapp.com/')">CloudMoon</button>
    <button class="src-btn" onclick="loadSrc('https://nb-ga.github.io/games-site/')">GPlus Mirror</button>
    <button class="src-btn" onclick="loadSrc('https://ghgames.netlify.app/games')">Netlify Games</button>
    <button class="src-btn" onclick="loadSrc('https://jhlee12.github.io/gba/')">GBA Hub</button>
    <button class="src-btn" onclick="loadSrc('https://99-classroom.github.io/Unblocked-Games-g-plus/')">Gplus Hub</button>
    <a class="src-btn" href="index.html">⟵ Back</a>
</div>

<div id="frame-box">
    <iframe id="gameframe"></iframe>
</div>

<p id="error-msg">⚠ This site blocks iframes (X-Frame-Options / CSP). Try a different source or use a GitHub mirror.</p>

<script>
function loadSrc(url){
    let frame = document.getElementById("gameframe");
    let error = document.getElementById("error-msg");

    error.style.display = "none";
    frame.src = url;

    // Detect iframe blocking
    setTimeout(()=>{
        try {
            let test = frame.contentWindow.location.href;
        } catch(e){
            error.style.display = "block";
        }
    }, 2000);
}
</script>

</body>
</html>
